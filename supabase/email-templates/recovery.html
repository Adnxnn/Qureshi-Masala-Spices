<div style="margin:0;padding:28px 16px;background:#f4f0e7;font-family:Arial,sans-serif;color:#263426">
  <div style="max-width:520px;margin:auto;padding:32px;border:1px solid #ddd2b8;border-radius:16px;background:#fffdf8">
    <p style="margin:0 0 12px;color:#9a7746;font-size:12px;font-weight:700;letter-spacing:2px">QMS ACCOUNT RECOVERY</p>
    <h1 style="margin:0 0 14px;font:normal 32px Georgia,serif">Reset your password.</h1>
    <p style="font-size:15px;line-height:1.6">Enter this one-time code on the QMS password recovery page:</p>
    <p style="margin:18px 0;padding:17px;border-radius:10px;background:#edf1e7;color:#294a32;text-align:center;font-size:32px;font-weight:700;letter-spacing:8px">{{ .Token }}</p>
    <p style="font-size:14px;line-height:1.6">You can also use the secure link below:</p>
    <p><a href="{{ .ConfirmationURL }}" style="display:inline-block;padding:13px 20px;border-radius:9px;background:#2e5636;color:#fff;text-decoration:none;font-weight:700">Reset password</a></p>
    <p style="margin:22px 0 0;color:#687568;font-size:12px;line-height:1.6">If you did not ask to reset your password, you can ignore this email. Do not share this code or link.</p>
  </div>
</div>
